name: Rust Windows Build and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    outputs:
      signing-artifact-id: ${{ steps.signing-input.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          $config = Get-Content rust-toolchain.toml -Raw
          $channel = [regex]::Match($config, '(?m)^channel\s*=\s*"([^"]+)"').Groups[1].Value
          if (!$channel) { throw 'Missing Rust channel in rust-toolchain.toml' }
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
      - name: Check formatting and Rust diagnostics
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test and build standalone executable
        run: ./build.ps1
      - name: Upload signing input
        id: signing-input
        if: vars.SIGNPATH_ENABLED == 'true' && github.event_name != 'pull_request' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CPlusCleaner-signing-input
          path: dist/CPlusCleaner.exe
          if-no-files-found: error
      - name: Upload portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CPlusCleaner-windows-x64
          path: |
            dist/CPlusCleaner.exe
            dist/CPlusCleaner-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/build-validation.json
          if-no-files-found: error
  sign:
    needs: build
    if: vars.SIGNPATH_ENABLED == 'true' && github.event_name != 'pull_request' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (!$version) { throw 'Missing version' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.signing-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.version.outputs.value }}"
      - name: Verify and package signed executable
        shell: pwsh
        run: ./package.ps1 -Executable signed/CPlusCleaner.exe -RequireSigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CPlusCleaner-windows-x64-signed
          path: |
            dist/CPlusCleaner.exe
            dist/CPlusCleaner-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: [build, sign]
    if: always() && !cancelled() && github.event_name == 'release' && needs.build.result == 'success' && (vars.SIGNPATH_ENABLED != 'true' || needs.sign.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ vars.SIGNPATH_ENABLED == 'true' && 'CPlusCleaner-windows-x64-signed' || 'CPlusCleaner-windows-x64' }}
          path: release-assets
      - name: Attach package to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release-assets/CPlusCleaner.exe release-assets/CPlusCleaner-windows-x64.zip release-assets/SHA256SUMS.txt --repo "$REPOSITORY" --clobber
