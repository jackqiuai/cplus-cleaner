name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-exe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Verify source and resources
        run: python tools/verify_source_tree.py
      - name: Summarize previous failed regression run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import json,os,re,urllib.request,urllib.error
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'CPlus-Cleaner-CI-Diagnostics'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response:
                  return json.load(response)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):
                  return None
          try:
              jobs=get(base+'/actions/runs/40373910774/jobs')['jobs']
              job=next(j for j in jobs if j['conclusion']=='failure')
              request=urllib.request.Request(base+'/actions/jobs/'+str(job['id'])+'/logs',headers=headers)
              try:
                  with urllib.request.build_opener(NoRedirect).open(request,timeout=30) as response:
                      log=response.read().decode('utf-8',errors='replace')
              except urllib.error.HTTPError as redirect:
                  if redirect.code not in (301,302,303,307,308):
                      raise
                  with urllib.request.urlopen(redirect.headers['Location'],timeout=30) as response:
                      log=response.read().decode('utf-8',errors='replace')
              # Downloaded logs prefix every line with a UTC timestamp.
              log=re.sub(r'(?m)^\d{4}-\d\d-\d\dT[\d:.]+Z ', '',log)
              blocks=re.findall(r'(?ms)^={10,}\r?\n(?:FAIL|ERROR):.*?(?=^={10,}|\Z)',log)
              for block in blocks:
                  message=block[-3000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::notice title=Previous regression failure::'+message,flush=True)
              print('Previous failure blocks:',len(blocks),flush=True)
          except (OSError,StopIteration) as error:
              print('Previous-run diagnostics unavailable:',type(error).__name__,flush=True)
          '@ | python -
      - name: Run Windows regression tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Path build -Force | Out-Null
          python -m unittest discover -s tests -v > build/test-output.log 2>&1
          $testExit = $LASTEXITCODE
          Get-Content build/test-output.log
          if ($testExit -ne 0) {
            $output = Get-Content build/test-output.log -Raw
            $blocks = [regex]::Matches($output, '(?ms)^={10,}\r?\n(?:FAIL|ERROR):.*?(?=^={10,}|\z)')
            if ($blocks.Count -eq 0) {
              $blocks = @([pscustomobject]@{ Value = $output })
            }
            foreach ($block in $blocks) {
              $failure = $block.Value
              if ($failure.Length -gt 3000) { $failure = $failure.Substring($failure.Length - 3000) }
              $escaped = $failure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows regression test failure::$escaped"
            }
            exit $testExit
          }
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build and smoke-test standalone EXE
        run: python tools/build_windows.py
      - name: Upload executable and portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CPlusCleaner-windows-x64
          path: |
            dist/CPlusCleaner.exe
            dist/CPlusCleaner-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-build-diagnostics
          path: |
            build/test-output.log
            build/smoke-test.json
            build/CPlusCleaner/warn-CPlusCleaner.txt
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Attach binaries to published release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CPlusCleaner-windows-x64
          path: release-assets
      - name: Upload to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh release upload "$RELEASE_TAG"
          release-assets/CPlusCleaner.exe
          release-assets/CPlusCleaner-windows-x64.zip
          release-assets/SHA256SUMS.txt
          --repo "$REPOSITORY" --clobber

# Purpose: Automatic Windows executable builds and published release attachments
