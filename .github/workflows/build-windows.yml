name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    outputs:
      signing-artifact-id: ${{ steps.signing-input.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Verify source and resources
        run: python tools/verify_source_tree.py
      - name: Run Windows regression tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          # Hosted checkout volumes may not support native NTFS compression.
          $env:CPLUS_NATIVE_TEST_ROOT = Join-Path $env:SystemDrive 'cplus-cleaner-native-tests'
          New-Item -ItemType Directory -Path $env:CPLUS_NATIVE_TEST_ROOT -Force | Out-Null
          New-Item -ItemType Directory -Path build -Force | Out-Null
          python -m unittest discover -s tests -v > build/test-output.log 2>&1
          $testExit = $LASTEXITCODE
          Get-Content build/test-output.log
          if ($testExit -ne 0) {
            $output = (Get-Content build/test-output.log -Raw).Replace("`r", "")
            $blocks = [regex]::Matches($output, '(?ms)^={10,}\r?\n(?:FAIL|ERROR):.*?(?=^={10,}|\z)')
            if ($blocks.Count -eq 0) {
              $blocks = @([pscustomobject]@{ Value = $output })
            }
            foreach ($block in $blocks) {
              $failure = $block.Value
              if ($failure.Length -gt 3000) { $failure = $failure.Substring(0, 3000) }
              $escaped = $failure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows regression test failure::$escaped"
            }
            exit $testExit
          }
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build and smoke-test standalone EXE
        run: python tools/build_windows.py
      - name: Upload EXE for origin-verified signing
        id: signing-input
        if: >-
          vars.SIGNPATH_ENABLED == 'true' &&
          (github.event_name == 'release' ||
           (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
           (github.event_name == 'workflow_dispatch' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CPlusCleaner-signing-input
          path: dist/CPlusCleaner.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload executable and portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CPlusCleaner-windows-x64
          path: |
            dist/CPlusCleaner.exe
            dist/CPlusCleaner-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-build-diagnostics
          path: |
            build/test-output.log
            build/smoke-test.json
            build/CPlusCleaner/warn-CPlusCleaner.txt
          if-no-files-found: ignore
          retention-days: 14

  sign:
    name: Sign and verify Windows release
    needs: build
    if: >-
      vars.SIGNPATH_ENABLED == 'true' &&
      (github.event_name == 'release' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out the same source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Check signing configuration
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG',
                        'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')
          foreach ($setting in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($setting))) {
              throw "Missing signing configuration: $setting. See docs/CODE_SIGNING.md."
            }
          }
      - name: Read version from reviewed source
        id: version
        run: python -c "from tools.build_windows import application_version; print('value=' + application_version())" >> $env:GITHUB_OUTPUT
      - name: Submit to SignPath and wait for maintainer approval
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.signing-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.version.outputs.value }}"
      - name: Verify signature, smoke-test signed EXE and regenerate packages
        run: >-
          python tools/build_windows.py --package-only --require-signed
          --executable signed/CPlusCleaner.exe
      - name: Upload signed executable and portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CPlusCleaner-windows-x64-signed
          path: |
            dist/CPlusCleaner.exe
            dist/CPlusCleaner-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload signing verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-signing-diagnostics
          path: |
            build/signature-verification.json
            build/signed-smoke-test.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Attach binaries to published release
    if: >-
      always() && !cancelled() && github.event_name == 'release' && needs.build.result == 'success' &&
      (vars.SIGNPATH_ENABLED != 'true' || needs.sign.result == 'success')
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ vars.SIGNPATH_ENABLED == 'true' && 'CPlusCleaner-windows-x64-signed' || 'CPlusCleaner-windows-x64' }}
          path: release-assets
      - name: Upload to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh release upload "$RELEASE_TAG"
          release-assets/CPlusCleaner.exe
          release-assets/CPlusCleaner-windows-x64.zip
          release-assets/SHA256SUMS.txt
          --repo "$REPOSITORY" --clobber

# Purpose: Windows builds, optional approved SignPath signing and verified release attachments
