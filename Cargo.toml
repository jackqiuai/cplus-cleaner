[workspace]
members = ["crates/desktop", "crates/core", "crates/platform_windows"]
resolver = "2"

[workspace.package]
version = "1.1.3"
edition = "2024"
license = "MIT"
authors = ["jackqiuai"]
repository = "https://github.com/jackqiuai/cplus-cleaner"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
globset = "0.4"
anyhow = "1"
tempfile = "3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_Environment", "Win32_System_ApplicationInstallationAndServicing", "Win32_Globalization"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

